# DATA_MODE=dummy seeds Kanpur demo hospitals on empty DB.
# DATA_MODE=real skips seed so a real hospital can enter its own data.
app:
  data-mode: ${DATA_MODE:dummy}

server:
  port: 8080

spring:
  application:
    name: MediBud
  datasource:
    url: jdbc:h2:file:./data/medibud;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
